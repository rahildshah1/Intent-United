<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intent United | Set a New Password</title>
  <meta name="robots" content="noindex" />
  <script>document.documentElement.classList.add('js');</script>
  <!-- No requireAuth / redirectIfAuthed here: the emailed link creates a
       temporary recovery session, and this page is where it gets spent. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..600&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
  <header>
    <div class="container nav">
      <a href="login.html" class="brand">
        <img src="https://codehs.com/uploads/8e9d112bb9b3aef1c6da95f89f2f2823" alt="Intent United Logo" class="logo-image" />
      </a>
    </div>
  </header>

  <main>
    <section class="auth-section">
      <div class="container auth-grid">
        <div class="auth-visual reveal">
          <div class="tag">Account security</div>
          <h1>Set a <span class="accent">new password</span></h1>
          <p>Choose a password you don't use anywhere else. Once it's saved you'll sign in with it straight away.</p>
        </div>

        <div class="auth-card reveal">
          <div class="auth-body" id="auth-body">
            <h2 id="reset-title">New password</h2>
            <p class="auth-sub" id="reset-subtitle">Checking your reset link…</p>

            <div class="auth-error" id="auth-error" role="alert" hidden></div>
            <div class="auth-notice" id="auth-notice" role="status" hidden></div>

            <form id="reset-form" novalidate hidden>
              <label class="field">
                <span>New password</span>
                <div class="password-wrap">
                  <input type="password" name="password" id="password" placeholder="Enter a new password" autocomplete="new-password" required />
                  <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Show password">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3.2"/></svg>
                  </button>
                </div>
                <ul class="pw-checklist" id="pw-checklist">
                  <li class="pw-check" data-rule="length"><span class="pw-check-icon"></span>At least 8 characters</li>
                  <li class="pw-check" data-rule="upper"><span class="pw-check-icon"></span>One uppercase letter</li>
                  <li class="pw-check" data-rule="lower"><span class="pw-check-icon"></span>One lowercase letter</li>
                  <li class="pw-check" data-rule="number"><span class="pw-check-icon"></span>One number</li>
                  <li class="pw-check" data-rule="symbol"><span class="pw-check-icon"></span>One symbol</li>
                </ul>
              </label>

              <label class="field">
                <span>Confirm new password</span>
                <input type="password" name="confirm" id="confirm" placeholder="Re-enter the password" autocomplete="new-password" required />
              </label>

              <button type="submit" class="btn btn-primary auth-submit" id="reset-submit">Save New Password</button>
            </form>

            <p class="auth-switch" id="reset-switch" hidden>
              <a href="login.html">Back to log in</a>
            </p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container footer-grid">
      <div>
        <strong>Intent United</strong>
        <p>AI for children with dignity, care, and local partnership.</p>
      </div>
      <div class="footer-links">
        <a href="login.html">Sign in</a>
      </div>
    </div>
  </footer>

  <script src="main.js"></script>
  <script>
    (function () {
      "use strict";

      var form = document.getElementById('reset-form');
      var pwInput = document.getElementById('password');
      var confirmInput = document.getElementById('confirm');
      var submitBtn = document.getElementById('reset-submit');
      var subtitle = document.getElementById('reset-subtitle');
      var errorBox = document.getElementById('auth-error');
      var noticeBox = document.getElementById('auth-notice');
      var toggleBtn = document.getElementById('toggle-pw');
      var backLink = document.getElementById('reset-switch');

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.hidden = false;
      }
      function clearError() {
        errorBox.hidden = true;
        errorBox.textContent = '';
      }
      function showNotice(msg) {
        noticeBox.textContent = msg;
        noticeBox.hidden = false;
      }

      // Same rules the signup form enforces, so a reset can't sidestep them.
      var pwRules = {
        length: function (v) { return v.length >= 8; },
        upper: function (v) { return /[A-Z]/.test(v); },
        lower: function (v) { return /[a-z]/.test(v); },
        number: function (v) { return /[0-9]/.test(v); },
        symbol: function (v) { return /[^A-Za-z0-9]/.test(v); }
      };
      var pwCheckEls = Array.prototype.slice.call(document.querySelectorAll('.pw-check'));

      function updatePwChecklist() {
        var value = pwInput.value;
        pwCheckEls.forEach(function (el) {
          var rule = pwRules[el.dataset.rule];
          var met = !!(rule && rule(value));
          el.classList.toggle('is-met', met);
          el.classList.toggle('is-unmet', !met && value.length > 0);
        });
      }

      function pwFailedRules(value) {
        return Object.keys(pwRules).filter(function (key) { return !pwRules[key](value); });
      }

      pwInput.addEventListener('input', updatePwChecklist);

      toggleBtn.addEventListener('click', function () {
        var hidden = pwInput.type === 'password';
        pwInput.type = hidden ? 'text' : 'password';
        toggleBtn.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
        toggleBtn.classList.toggle('is-visible', hidden);
      });

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        clearError();

        var password = pwInput.value;
        if (pwFailedRules(password).length) {
          updatePwChecklist();
          showError("Your password doesn't meet the requirements below.");
          return;
        }
        if (password !== confirmInput.value) {
          showError('The two passwords do not match.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving…';

        try {
          await IntentAuth.updatePassword(password);
          // Sign the recovery session out so the new password is what gets
          // used from here on, on this device and every other one.
          await IntentAuth.logout('login.html?reset=1');
        } catch (err) {
          showError(err && err.message ? err.message : 'We could not save your new password. Please try again.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Save New Password';
        }
      });

      // Redeem the token from the emailed link before showing the form.
      (async function () {
        if (!window.IntentAuth) {
          subtitle.textContent = 'Password reset is not configured.';
          showError('Auth is not configured yet. Check that config.js is present.');
          backLink.hidden = false;
          return;
        }
        try {
          await IntentAuth.startPasswordRecovery();
          subtitle.textContent = 'Choose a new password for your account.';
          form.hidden = false;
          pwInput.focus();
        } catch (err) {
          subtitle.textContent = 'This link can no longer be used.';
          showError(err && err.message
            ? err.message
            : 'This reset link is invalid or has expired. Request a new one.');
          showNotice('Head back to the log in page and choose "Forgot password?" to get a fresh link.');
          backLink.hidden = false;
        }
      })();
    })();
  </script>
</body>
</html>
